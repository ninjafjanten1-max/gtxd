```html
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOM-ish</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: monospace;
}

#game {
  width: 100vw;
  height: 100vh;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 22px;
  text-shadow: 2px 2px #000;
}

#hud {
  position: absolute;
  left: 20px;
  bottom: 18px;
  color: #fff;
  font-size: 20px;
  text-shadow: 2px 2px #000;
}

#message {
  position: absolute;
  left: 50%;
  top: 30%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 28px;
  text-align: center;
  text-shadow: 3px 3px #000;
}

#start {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 24px;
  text-align: center;
  cursor: pointer;
  pointer-events: auto;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="crosshair">+</div>
  <div id="hud">HP: <span id="hp">100</span> | AMMO: <span id="ammo">50</span></div>
  <div id="message"></div>

  <div id="start">
    <div>
      <div style="font-size:42px;margin-bottom:20px">DOOM-ish</div>
      KLICKA FÖR ATT STARTA<br><br>
      WASD = GÅ<br>
      MUS = TITTA<br>
      VÄNSTERKLICK = SKJUT
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let W = 0;
let H = 0;

function resize() {
  W = canvas.width = Math.min(window.innerWidth, 960);
  H = canvas.height = Math.min(window.innerHeight, 540);
}

window.addEventListener("resize", resize);
resize();


// ===============================
// KARTA
// ===============================

const map = [
  "################",
  "#..............#",
  "#..####........#",
  "#..............#",
  "#.......##.....#",
  "#..............#",
  "#....#.........#",
  "#....#.........#",
  "#..............#",
  "#..............#",
  "#.......####...#",
  "#..............#",
  "#..##..........#",
  "#..............#",
  "#..............#",
  "################"
];

const MAP_W = map[0].length;
const MAP_H = map.length;


// ===============================
// SPELARE
// ===============================

const player = {
  x: 3.5,
  y: 3.5,
  angle: 0,
  speed: 3.0,
  hp: 100,
  ammo: 50
};


// ===============================
// FIENDER
// ===============================

const enemies = [
  { x: 11.5, y: 3.5, hp: 3, alive: true },
  { x: 8.5, y: 8.5, hp: 3, alive: true },
  { x: 4.5, y: 11.5, hp: 3, alive: true },
  { x: 12.5, y: 12.5, hp: 3, alive: true }
];


// ===============================
// INSTÄLLNINGAR
// ===============================

const FOV = Math.PI / 3;
const RAYS = 320;
const MAX_DEPTH = 20;

let keys = {};
let mouseDown = false;
let started = false;

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === " ") {
    shoot();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});


// ===============================
// MUS
// ===============================

document.getElementById("start").addEventListener("click", () => {
  started = true;

  document.getElementById("start").style.display = "none";

  canvas.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (!started) return;

  if (document.pointerLockElement === canvas) {
    player.angle += e.movementX * 0.0025;
  }
});

document.addEventListener("mousedown", e => {
  if (e.button === 0 && started) {
    mouseDown = true;
    shoot();
  }
});

document.addEventListener("mouseup", e => {
  if (e.button === 0) {
    mouseDown = false;
  }
});


// ===============================
// KOLLISION
// ===============================

function wall(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);

  if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) {
    return true;
  }

  return map[my][mx] === "#";
}

function canMove(x, y) {
  const r = 0.2;

  return (
    !wall(x - r, y - r) &&
    !wall(x + r, y - r) &&
    !wall(x - r, y + r) &&
    !wall(x + r, y + r)
  );
}


// ===============================
// RÖRELSE
// ===============================

function update(dt) {

  if (!started || player.hp <= 0) return;

  let dx = 0;
  let dy = 0;

  const forwardX = Math.cos(player.angle);
  const forwardY = Math.sin(player.angle);

  const rightX = Math.cos(player.angle + Math.PI / 2);
  const rightY = Math.sin(player.angle + Math.PI / 2);

  if (keys["w"]) {
    dx += forwardX;
    dy += forwardY;
  }

  if (keys["s"]) {
    dx -= forwardX;
    dy -= forwardY;
  }

  if (keys["a"]) {
    dx -= rightX;
    dy -= rightY;
  }

  if (keys["d"]) {
    dx += rightX;
    dy += rightY;
  }

  const length = Math.hypot(dx, dy);

  if (length > 0) {
    dx /= length;
    dy /= length;

    dx *= player.speed * dt;
    dy *= player.speed * dt;

    if (canMove(player.x + dx, player.y)) {
      player.x += dx;
    }

    if (canMove(player.x, player.y + dy)) {
      player.y += dy;
    }
  }

  updateEnemies(dt);
}


// ===============================
// FIENDER
// ===============================

function updateEnemies(dt) {

  for (const e of enemies) {

    if (!e.alive) continue;

    const dx = player.x - e.x;
    const dy = player.y - e.y;

    const distance = Math.hypot(dx, dy);

    if (distance < 0.7) {
      player.hp -= 20 * dt;
      continue;
    }

    if (distance < 8) {

      const dirX = dx / distance;
      const dirY = dy / distance;

      const speed = 0.6 * dt;

      const nx = e.x + dirX * speed;
      const ny = e.y + dirY * speed;

      if (!wall(nx, e.y)) {
        e.x = nx;
      }

      if (!wall(e.x, ny)) {
        e.y = ny;
      }
    }
  }
}


// ===============================
// SKJUT
// ===============================

function shoot() {

  if (!started) return;
  if (player.hp <= 0) return;
  if (player.ammo <= 0) return;

  player.ammo--;

  let best = null;
  let bestDistance = Infinity;

  for (const e of enemies) {

    if (!e.alive) continue;

    const dx = e.x - player.x;
    const dy = e.y - player.y;

    const distance = Math.hypot(dx, dy);

    let angle = Math.atan2(dy, dx) - player.angle;

    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;

    if (Math.abs(angle) < 0.10 && distance < bestDistance) {

      // Kontrollera att väggen inte är i vägen.
      const steps = Math.ceil(distance * 10);
      let blocked = false;

      for (let i = 1; i < steps; i++) {
        const t = i / steps;

        const x = player.x + dx * t;
        const y = player.y + dy * t;

        if (wall(x, y)) {
          blocked = true;
          break;
        }
      }

      if (!blocked) {
        best = e;
        bestDistance = distance;
      }
    }
  }

  if (best) {
    best.hp--;

    if (best.hp <= 0) {
      best.alive = false;
    }
  }
}


// ===============================
// RAYCASTING
// ===============================

function castRay(angle) {

  const rayX = Math.cos(angle);
  const rayY = Math.sin(angle);

  let distance = 0;

  while (distance < MAX_DEPTH) {

    distance += 0.025;

    const x = player.x + rayX * distance;
    const y = player.y + rayY * distance;

    if (wall(x, y)) {

      return {
        distance,
        x,
        y
      };
    }
  }

  return {
    distance: MAX_DEPTH,
    x: player.x + rayX * MAX_DEPTH,
    y: player.y + rayY * MAX_DEPTH
  };
}


// ===============================
// RITA
// ===============================

function render() {

  // Himmel
  ctx.fillStyle = "#303030";
  ctx.fillRect(0, 0, W, H / 2);

  // Golv
  ctx.fillStyle = "#171717";
  ctx.fillRect(0, H / 2, W, H / 2);

  const depthBuffer = [];

  // Väggar
  for (let i = 0; i < RAYS; i++) {

    const cameraX = i / RAYS;

    const rayAngle =
      player.angle - FOV / 2 + cameraX * FOV;

    const hit = castRay(rayAngle);

    // Fixa fisheye
    const corrected =
      hit.distance *
      Math.cos(rayAngle - player.angle);

    depthBuffer[i] = corrected;

    const wallHeight =
      Math.min(H * 2, H / corrected);

    const x = i * (W / RAYS);

    const y = H / 2 - wallHeight / 2;

    // Enkla ljusnivåer
    let shade = 180 - corrected * 15;

    shade = Math.max(25, Math.min(180, shade));

    ctx.fillStyle =
      `rgb(${shade},${shade},${shade})`;

    ctx.fillRect(
      x,
      y,
      W / RAYS + 1,
      wallHeight
    );
  }


  // Fiender
  for (const e of enemies) {

    if (!e.alive) continue;

    const dx = e.x - player.x;
    const dy = e.y - player.y;

    const distance = Math.hypot(dx, dy);

    let angle =
      Math.atan2(dy, dx) - player.angle;

    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;

    if (Math.abs(angle) > FOV / 2 + 0.3) {
      continue;
    }

    const corrected =
      distance * Math.cos(angle);

    if (corrected <= 0) continue;

    const screenX =
      W / 2 +
      Math.tan(angle) *
      (W / 2) /
      Math.tan(FOV / 2);

    const size =
      H / corrected * 0.75;

    const left =
      screenX - size / 2;

    const top =
      H / 2 - size / 2;


    // Rita fienden kolumn för kolumn
    const startRay = Math.floor(
      Math.max(0, left / W * RAYS)
    );

    const endRay = Math.floor(
      Math.min(RAYS - 1, (left + size) / W * RAYS)
    );

    for (let r = startRay; r <= endRay; r++) {

      if (corrected < depthBuffer[r]) {

        const px = r * (W / RAYS);

        const rel =
          (px - left) / size;

        // Enkel pixelart-liknande fiende
        const center = 0.5;

        const head =
          Math.abs(rel - center) < 0.32;

        const body =
          Math.abs(rel - center) < 0.45;

        if (head) {

          ctx.fillStyle = "#9b0000";

          ctx.fillRect(
            px,
            top + size * 0.10,
            W / RAYS + 1,
            size * 0.25
          );

        } else if (body) {

          ctx.fillStyle = "#c00000";

          ctx.fillRect(
            px,
            top + size * 0.32,
            W / RAYS + 1,
            size * 0.55
          );
        }
      }
    }
  }


  // Vapen
  drawWeapon();


  // Spelstatus
  if (player.hp <= 0) {

    ctx.fillStyle = "rgba(120,0,0,.5)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 50px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
      "DU DOG",
      W / 2,
      H / 2
    );

    ctx.font = "20px monospace";

    ctx.fillText(
      "Ladda om sidan för att försöka igen",
      W / 2,
      H / 2 + 45
    );
  }

  const alive =
    enemies.filter(e => e.alive).length;

  if (alive === 0 && player.hp > 0) {

    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 45px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
      "BANAN KLAR!",
      W / 2,
      H / 2
    );
  }
}


// ===============================
// VAPEN
// ===============================

function drawWeapon() {

  const gunW = W * 0.25;
  const gunH = H * 0.35;

  const x = W / 2 - gunW / 2;
  const y = H - gunH * 0.75;

  // Arm
  ctx.fillStyle = "#7d4d2b";

  ctx.fillRect(
    x + gunW * 0.15,
    y + gunH * 0.45,
    gunW * 0.22,
    gunH * 0.55
  );

  ctx.fillRect(
    x + gunW * 0.63,
    y + gunH * 0.45,
    gunW * 0.22,
    gunH * 0.55
  );

  // Vapen
  ctx.fillStyle = "#222";

  ctx.fillRect(
    x + gunW * 0.30,
    y,
    gunW * 0.40,
    gunH * 0.75
  );

  ctx.fillStyle = "#555";

  ctx.fillRect(
    x + gunW * 0.42,
    y - gunH * 0.12,
    gunW * 0.16,
    gunH * 0.25
  );

  ctx.fillStyle = "#111";

  ctx.fillRect(
    x + gunW * 0.46,
    y - gunH * 0.18,
    gunW * 0.08,
    gunH * 0.20
  );
}


// ===============================
// HUD
// ===============================

function updateHUD() {

  document.getElementById("hp").textContent =
    Math.max(0, Math.floor(player.hp));

  document.getElementById("ammo").textContent =
    player.ammo;
}


// ===============================
// SPELLOOP
// ===============================

let last = performance.now();

function loop(now) {

  const dt =
    Math.min(0.05, (now - last) / 1000);

  last = now;

  update(dt);
  render();
  updateHUD();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
