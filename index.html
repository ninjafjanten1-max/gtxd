<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veckoschema — Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#10131b;
    --panel:#1a1f2b;
    --panel-2:#151a24;
    --line:#262c3a;
    --text:#f0f2f7;
    --muted:#7c8599;
    --now:#ff5a36;
    --now-glow: rgba(255,90,54,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 60px;
  }

  .wrap{max-width:1200px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--now);}

  .weekbadge{
    display:inline-block;
    margin-top:6px;
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:999px;
  }

  .clock{
    font-family:'Space Grotesk',sans-serif;
    font-size:34px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.02em;
  }
  .clock .date{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:2px;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:16px;
  }

  .status{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--now);
    border-radius:8px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    flex:1;
    min-width:260px;
  }
  .status .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--now);
    box-shadow:0 0 0 5px var(--now-glow);
    flex-shrink:0;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 5px var(--now-glow);}
    50%{box-shadow:0 0 0 9px transparent;}
  }
  .status b{font-weight:700;}
  .status .muted{color:var(--muted);}

  .weektoggle{
    display:flex;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .weektoggle button{
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .weektoggle button.active{
    background:var(--now);
    color:#fff;
  }
  .weektoggle button:not(.active):hover{
    color:var(--text);
    background:var(--panel-2);
  }

  .board-scroll{
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }

  .board{
    display:grid;
    grid-template-columns:52px repeat(5,1fr);
    background:var(--panel-2);
  }

  .daylabel{
    padding:12px 6px;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    border-bottom:1px solid var(--line);
    border-left:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--panel-2);
    z-index:3;
  }
  .daylabel.today{color:var(--now);}
  .daylabel .d{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:2px;
  }
  .daylabel.today .d{color:var(--now);}
  .daylabel .datenum{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .daylabel.today .datenum{color:var(--now);}
  .corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-2);z-index:3;}

  .timecol{
    position:relative;
    border-right:1px solid var(--line);
  }
  .timecol .tick{
    position:absolute;
    right:6px;
    transform:translateY(-50%);
    font-size:10px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .daycol{
    position:relative;
    border-left:1px solid var(--line);
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 59px,
        var(--line) 60px
      );
  }
  .daycol.today{background-color:rgba(255,90,54,0.035);}

  .lesson{
    position:absolute;
    left:4px;right:4px;
    border-radius:6px;
    padding:6px 8px;
    font-size:11.5px;
    line-height:1.35;
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.25);
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
    transition:transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
    z-index:2;
  }
  .lesson:hover{transform:scale(1.02);box-shadow:0 3px 10px rgba(0,0,0,0.45);}
  .lesson .t{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12px;
    display:block;
  }
  .lesson .meta{
    display:block;
    opacity:0.85;
    font-size:10.5px;
    margin-top:1px;
  }
  .lesson .time{
    display:block;
    font-size:9.5px;
    opacity:0.7;
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }

  .lesson.active{
    transform:scale(1.015);
    box-shadow:0 0 0 2px var(--now), 0 4px 14px rgba(255,90,54,0.35);
    z-index:5;
  }

  .gap{
    position:absolute;
    left:50%;
    width:0;
    border-left:2px dashed #3a4256;
    z-index:1;
  }
  .gap .glbl{
    position:absolute;
    left:7px;
    top:50%;
    transform:translateY(-50%);
    font-size:9px;
    color:var(--muted);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:1px 5px;
    border-radius:4px;
    white-space:nowrap;
  }

  .nowline{
    position:absolute;
    left:0;right:0;
    height:0;
    border-top:2px solid var(--now);
    z-index:6;
    pointer-events:none;
  }
  .nowline::before{
    content:"";
    position:absolute;
    left:-4px;top:-4px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--now);
    box-shadow:0 0 8px 2px var(--now-glow);
  }
  .nowline .lbl{
    position:absolute;
    right:4px;top:-9px;
    background:var(--now);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    padding:1px 5px;
    border-radius:4px;
    font-variant-numeric:tabular-nums;
  }

  footer{
    margin-top:20px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
  }

  .chatbot-card{
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px 18px;
  }
  .chatbot-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .chatbot-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .chatbot-sub{
    font-size:11.5px;
    color:var(--muted);
  }
  #startChatBtn{
    background:var(--now);
    color:#fff;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
  }
  #startChatBtn:hover{filter:brightness(1.08);}

  #chatLog{
    height:260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:4px 4px 8px;
    margin-bottom:10px;
  }
  .msg{
    max-width:75%;
    padding:8px 12px;
    border-radius:12px;
    font-size:13.5px;
    line-height:1.4;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--now);
    color:#fff;
    border-bottom-right-radius:3px;
  }
  .chatInputRow{
    display:flex;
    gap:8px;
  }
  #chatInput{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px; /* >=16px så mobilen (iOS Safari) inte zoomar in vid fokus */
  }
  #chatInput:focus{outline:1px solid var(--now);}
  #chatSend{
    background:var(--now);
    color:#fff;
    border:none;
    font-weight:600;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
  }
  #chatSend:hover{filter:brightness(1.08);}

  /* Modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(8,10,15,0.65);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:4px solid var(--modal-accent, var(--now));
    border-radius:12px;
    max-width:360px;
    width:100%;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    position:relative;
  }
  .modal h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    margin:0 0 4px;
  }
  .modal .modalday{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:14px;
  }
  .modal .row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .modal .row:first-of-type{border-top:1px solid var(--line);}
  .modal .row span:first-child{color:var(--muted);}
  .modal .close{
    position:absolute;
    top:14px;right:14px;
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-size:15px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal .close:hover{background:var(--line);}

  @media (max-width:720px){
    .board{grid-template-columns:38px repeat(5,1fr);}
    .lesson{font-size:9.5px;padding:4px 5px;}
    .lesson .t{font-size:10px;}
    .lesson .meta,.lesson .time{font-size:8.5px;}
    .daylabel{font-size:11px;padding:8px 2px;}
    .daylabel .d{font-size:9px;}
    .clock{font-size:24px;}
    .gap .glbl{font-size:8px;padding:1px 3px;}
    .controls{flex-direction:column;align-items:stretch;}
    .weektoggle{justify-content:center;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Veckoschema <span>· live</span></h1>
      <div class="weekbadge" id="weekBadge">Vecka —</div>
    </div>
    <div class="clock" id="clock">--:--:--<span class="date" id="dateLabel">—</span></div>
  </header>

  <div class="controls">
    <div class="status" id="statusBar">
      <div class="dot"></div>
      <div id="statusText">Laddar…</div>
    </div>
    <div class="weektoggle" id="weekToggle">
      <button id="btnPappa" data-week="pappa">Pappa-vecka</button>
      <button id="btnMamma" data-week="mamma">Mamma-vecka</button>
    </div>
  </div>

  <div class="board-scroll">
    <div class="board" id="board">
      <div class="corner"></div>
      <!-- day labels injected by JS -->
    </div>
  </div>

  <div class="chatbot-card">
    <div class="chatbot-head">
      <span class="chatbot-title">Hörby GPT</span>
      <span class="chatbot-sub">svarar på nyckelord, gör som han vill</span>
    </div>
    <div id="chatContainer">
      <button id="startChatBtn">Börja chatta</button>
    </div>
  </div>

  <footer>Linjen visar var i dagen du befinner dig just nu · streckade linjer visar tid mellan block · klicka på ett block för detaljer</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close" id="closeModal">✕</button>
    <div class="modalday" id="modalDay">—</div>
    <h2 id="modalTitle">—</h2>
    <div class="row"><span>Tid</span><span id="modalTime">—</span></div>
    <div class="row"><span>Längd</span><span id="modalDuration">—</span></div>
    <div class="row" id="modalMetaRow"><span>Info</span><span id="modalMeta">—</span></div>
  </div>
</div>

<script>
/* ---------- SKOLSCHEMA (fasta block) ---------- */
/* day: 1=Mån 2=Tis 3=Ons 4=Tor 5=Fre */
const schoolLessons = [
  // Måndag
  {day:1, start:"09:45", end:"11:35", title:"Ellära Nivå 1", meta:"KaL · E206", color:"#3ecf6a"},
  {day:1, start:"12:15", end:"15:30", title:"Installationsteknik Nivå 1", meta:"CaJ · E174, E177", color:"#c2185b"},
  {day:1, start:"15:40", end:"16:40", title:"Naturkunskap Nivå 1a1", meta:"MiÅ · Q323", color:"#e08a1e"},

  // Tisdag
  {day:2, start:"08:20", end:"09:30", title:"Engelska Nivå 2", meta:"JoW, OhM · E177", color:"#d8cdb8"},
  {day:2, start:"09:50", end:"11:10", title:"Svenska Nivå 2", meta:"TvC · E177", color:"#1746d8"},
  {day:2, start:"11:20", end:"12:20", title:"Installationsteknik Nivå 1", meta:"CaJ · E174", color:"#c2185b"},
  {day:2, start:"14:10", end:"16:00", title:"Kommunikationsnät Nivå 1", meta:"CaJ · E174, E177", color:"#c2185b"},
  {day:2, start:"18:30", end:"20:00", title:"Träning", meta:"", color:"#0d9488"},

  // Onsdag
  {day:3, start:"08:10", end:"08:30", title:"Mentorstid", meta:"CaJ · E174, E177", color:"#4a5568"},
  {day:3, start:"08:30", end:"09:55", title:"Installationsteknik Nivå 1", meta:"CaJ · E174, E177", color:"#c2185b"},
  {day:3, start:"10:05", end:"11:10", title:"Kommunikationsnät Nivå 1", meta:"CaJ · E174, E177", color:"#c2185b"},
  {day:3, start:"11:50", end:"12:50", title:"Service och bemötande Nivå 1", meta:"SöT · E177", color:"#b5541a"},
  {day:3, start:"13:00", end:"14:10", title:"Engelska Nivå 2", meta:"JoW, OhM · E177", color:"#d8cdb8"},
  {day:3, start:"14:20", end:"15:30", title:"Svenska Nivå 2", meta:"TvC · E177", color:"#1746d8"},
  {day:3, start:"16:00", end:"18:30", title:"Hemspråk", meta:"", color:"#7c3aed"},

  // Torsdag
  {day:4, start:"08:20", end:"09:20", title:"Naturkunskap Nivå 1a1", meta:"MiÅ · Q325", color:"#e08a1e"},
  {day:4, start:"09:30", end:"11:20", title:"Underhåll – Elteknik Nivå 1", meta:"CaJ · E174, E177", color:"#0e8f7a"},
  {day:4, start:"12:50", end:"14:40", title:"Ellära Nivå 1", meta:"KaL · E206", color:"#3ecf6a"},
  {day:4, start:"14:50", end:"16:20", title:"Matematik Nivå 2a", meta:"SeN · A11", color:"#e02424"},
  {day:4, start:"18:30", end:"20:00", title:"Träning", meta:"", color:"#0d9488"},

  // Fredag
  {day:5, start:"08:10", end:"09:55", title:"Matematik Nivå 2a", meta:"SeN · A11", color:"#e02424"},
  {day:5, start:"10:15", end:"11:15", title:"Service och bemötande Nivå 1", meta:"SöT · E209", color:"#b5541a"},
  {day:5, start:"12:20", end:"13:30", title:"Svenska Nivå 2", meta:"TvC · E177", color:"#1746d8"},
  {day:5, start:"13:40", end:"14:55", title:"Engelska Nivå 2", meta:"JoW, OhM · E177", color:"#d8cdb8"},
];

const dayNames = {1:"Måndag",2:"Tisdag",3:"Onsdag",4:"Torsdag",5:"Fredag"};
const dayShort = {1:"MÅN",2:"TIS",3:"ONS",4:"TOR",5:"FRE"};

/* Vaknar-tider beroende på veckotyp: måndag skiljer sig från övriga dagar */
const WAKE_TIMES = {
  pappa: {1:"07:50", other:"06:15"},
  mamma: {1:"09:00", other:"07:35"}
};

/* Busstider gäller bara pappa-vecka (mamma-vecka bor 6 min från skolan) */
const BUS_TIMES = {
  1:      {depart:"08:48", arrive:"09:17", atSchool:"09:28"},
  other:  {depart:"07:04", arrive:"07:33", atSchool:"07:45"}
};

function firstLessonStart(d){
  const starts = schoolLessons.filter(L=>L.day===d).map(L=>toMin(L.start));
  return starts.length ? Math.min(...starts) : null;
}

function buildRoutineBlocks(weekType){
  const blocks = [];
  for(let d=1; d<=5; d++){
    const wake = d===1 ? WAKE_TIMES[weekType][1] : WAKE_TIMES[weekType].other;

    // morgonens sista sömn (fortsättning på gårdagskvällens läggning)
    blocks.push({day:d, start:"00:00", end:wake, title:"Sova", meta:"", color:"#2b3050", category:"sova"});

    // kvällsaktiviteter -> läsa -> sova (samma varje dag)
    blocks.push({day:d, start:"21:00", end:"22:15", title:"Kvällsaktiviteter", meta:"Äta, duscha, träna osv.", color:"#b45309", category:"kvall"});
    blocks.push({day:d, start:"22:15", end:"22:30", title:"Läsa", meta:"", color:"#64748b", category:"lasa"});
    blocks.push({day:d, start:"22:30", end:"24:00", title:"Sova", meta:"", color:"#2b3050", category:"sova"});

    if(weekType === 'pappa'){
      // buss: gå till hållplats -> buss avgår -> buss framme -> gå till skolan
      const bus = d===1 ? BUS_TIMES[1] : BUS_TIMES.other;
      const walkMin = d===1 ? 17 : 16;
      const departMin = toMin(bus.depart);
      const walkStart = hhmm(departMin - walkMin);
      blocks.push({day:d, start:walkStart, end:bus.depart, title:"Gå till bussen", meta:"", color:"#0369a1", category:"transport"});
      blocks.push({day:d, start:bus.depart, end:bus.arrive, title:"Buss", meta:"Avgår "+bus.depart+", framme "+bus.arrive, color:"#0ea5e9", category:"transport"});
      blocks.push({day:d, start:bus.arrive, end:bus.atSchool, title:"Gå till skolan", meta:"", color:"#0369a1", category:"transport"});
    } else {
      // mamma-vecka: cykla 12 min innan första lektionen
      const fls = firstLessonStart(d);
      if(fls !== null){
        blocks.push({day:d, start:hhmm(fls-12), end:hhmm(fls), title:"Cykla", meta:"", color:"#0369a1", category:"transport"});
      }
    }
  }
  return blocks;
}

const DAY_START = 0;        // 00:00
const DAY_END   = 24*60;    // 24:00
const PX_PER_MIN = 0.65;
const boardHeight = (DAY_END - DAY_START) * PX_PER_MIN;

function toMin(hhmmStr){
  const [h,m] = hhmmStr.split(":").map(Number);
  return h*60+m;
}
function yFor(minutes){
  return (minutes - DAY_START) * PX_PER_MIN;
}
function pad(n){return n<10 ? '0'+n : n;}

/* format ex: 45 -> "45 min", 90 -> "1 h 30 min", 60 -> "1 h" */
function fmtMin(total){
  total = Math.round(total);
  const h = Math.floor(total/60), m = total%60;
  if(h<=0) return m+" min";
  if(m===0) return h+" h";
  return h+" h "+m+" min";
}
function hhmm(total){
  return pad(Math.floor(total/60)%24)+':'+pad(Math.round(total)%60);
}

/* ---------- BOARD SKELETON (byggs en gång) ---------- */
const board = document.getElementById('board');
const todayIdx = new Date().getDay(); // 0=Sun..6=Sat

function getMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1) - day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function isLight(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 170;
}

const overlay = document.getElementById('overlay');

function openModal(L, s, e){
  document.getElementById('modalDay').textContent = dayNames[L.day];
  document.getElementById('modalTitle').textContent = L.title;
  document.getElementById('modalTime').textContent = L.start + '–' + L.end;
  document.getElementById('modalDuration').textContent = fmtMin(e-s);
  const metaRow = document.getElementById('modalMetaRow');
  if(L.meta){
    metaRow.style.display = 'flex';
    document.getElementById('modalMeta').textContent = L.meta;
  } else {
    metaRow.style.display = 'none';
  }
  modal.style.setProperty('--modal-accent', L.color);
  overlay.classList.add('open');
}

/* ---------- RENDER (byggs om vid veckobyte) ---------- */
let lessonEls = [];

function renderBoard(weekType){
  // rensa gamla block/gaps ur varje dagkolumn (men behåll ev. nu-linje separat)
  for(let d=1; d<=5; d++){
    dayColEls[d].querySelectorAll('.lesson, .gap').forEach(n=>n.remove());
  }
  lessonEls = [];

  const combined = schoolLessons.concat(buildRoutineBlocks(weekType));

  combined.forEach(L=>{
    const s = toMin(L.start), e = toMin(L.end);
    const div = document.createElement('div');
    div.className = 'lesson';
    div.style.top = yFor(s) + 'px';
    div.style.height = Math.max((e-s)*PX_PER_MIN - 2, 15) + 'px';
    div.style.background = L.color;
    div.style.color = isLight(L.color) ? '#1a1a1a' : '#fff';
    div.innerHTML =
      '<span class="t">'+L.title+'</span>' +
      (L.meta ? '<span class="meta">'+L.meta+'</span>' : '') +
      '<span class="time">'+L.start+'–'+L.end+'</span>';
    div.addEventListener('click', ()=> openModal(L, s, e));
    dayColEls[L.day].appendChild(div);
    lessonEls.push({el:div, day:L.day, start:s, end:e, title:L.title});
  });

  // gap-indikatorer mellan alla block (inkl. sova/läsa/kvällsaktiviteter) per dag
  for(let d=1; d<=5; d++){
    const dayBlocks = combined
      .filter(L=>L.day===d)
      .map(L=>({s:toMin(L.start), e:toMin(L.end)}))
      .sort((a,b)=>a.s-b.s);

    for(let i=0; i<dayBlocks.length-1; i++){
      const gapStart = dayBlocks[i].e;
      const gapEnd = dayBlocks[i+1].s;
      const gapMin = gapEnd - gapStart;
      if(gapMin <= 0) continue;

      const gap = document.createElement('div');
      gap.className = 'gap';
      gap.style.top = yFor(gapStart) + 'px';
      gap.style.height = (gapEnd-gapStart)*PX_PER_MIN + 'px';
      const glbl = document.createElement('span');
      glbl.className = 'glbl';
      glbl.textContent = fmtMin(gapMin);
      gap.appendChild(glbl);
      dayColEls[d].appendChild(gap);
    }
  }

  update();
}

/* ---------- LIVE NU-LINJE + KLOCKA + STATUS ---------- */
let nowLineEl = null;

function update(){
  const now = new Date();
  const dow = now.getDay();
  const mins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;

  document.getElementById('clock').innerHTML =
    pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()) +
    '<span class="date">'+ now.toLocaleDateString('sv-SE',{weekday:'long', day:'numeric', month:'long'}) +'</span>';

  lessonEls.forEach(o=>o.el.classList.remove('active'));

  const isSchoolDay = dow>=1 && dow<=5;

  if(isSchoolDay){
    if(!nowLineEl){
      nowLineEl = document.createElement('div');
      nowLineEl.className = 'nowline';
      nowLineEl.innerHTML = '<span class="lbl" id="nowlbl"></span>';
    }
    if(nowLineEl.parentElement !== dayColEls[dow]){
      dayColEls[dow].appendChild(nowLineEl);
    }
    nowLineEl.style.top = yFor(mins) + 'px';
    document.getElementById('nowlbl').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  } else if(nowLineEl){
    nowLineEl.remove();
    nowLineEl = null;
  }

  const statusText = document.getElementById('statusText');
  if(!isSchoolDay){
    statusText.innerHTML = '<b>Helg</b> <span class="muted">— inget schemalagt</span>';
  } else {
    const current = lessonEls.find(o => o.day===dow && mins>=o.start && mins<o.end);
    if(current){
      current.el.classList.add('active');
      const left = current.end - mins;
      statusText.innerHTML = 'Du är mitt i <b>'+current.title+'</b> <span class="muted">— slutar om '+fmtMin(left)+'</span>';
    } else {
      const upcoming = lessonEls
        .filter(o => o.day===dow && o.start > mins)
        .sort((a,b)=>a.start-b.start)[0];
      if(upcoming){
        const until = upcoming.start - mins;
        statusText.innerHTML = 'Ingen aktivitet just nu <span class="muted">— nästa: <b>'+upcoming.title+'</b> om '+fmtMin(until)+' ('+hhmm(upcoming.start)+')</span>';
      } else {
        statusText.innerHTML = '<b>Klart för idag</b> <span class="muted">— inget mer schemalagt</span>';
      }
    }
  }
}

    /* ==================== ÖVRIGT DIVERSE ==================== */
    {k:["hemlighet"], r:["Berätta då, jag skvallrar aldrig. Kanske.","Spännande, fortsätt."]},

  const FALLBACKS = [
    "Fattar inte vad du menar.",
    "Okej.",
    "Vet inte.",
    "Bryr mig inte direkt.",
    "Säg det på ett annat sätt.",
    "Om du säger det.",
    "Inte mitt problem.",
    "Så.",
    "Kort sagt, nej.",
    "Hörde dig men brydde mig inte."
  ];

  const TLDR_RESPONSES = [
    "Orkar inte läsa allt det där.",
    "Fatta dig kort.",
    "För långt. Skriv om.",
    "Läser inte romaner gratis.",
    "Kortare, tack.",
    "Nej."
  ];

  /* Slumpord som slängs tillbaka när boten inte fattar nåt alls, så det
     inte känns som att prata med en vägg. Blandad påse av substantiv. */
  const WORD_BANK = [
    "korv","potatis","gitarr","spindel","cykel","mössa","stjärna","paraply",
    "krokodil","lampa","hörby","mafia","jonas","keidser","bajs","fis",
    "räkmacka","tandkött","navelludd","spöke","utomjording","tuba","kaktus",
    "flamingo","ekorre","brödrost","väckarklocka","gitarrsolo","glass",
    "prutt","snorunge","skoter","raket","ubåt","struts","gurka","ananas",
    "vulkan","tornado","zombie","robot","dinosaurie","kanelbulle","fladdermus",
    "krabba","påfågel","gökur","dammsugare","gökotta","fotboll","tvättbjörn",
    "kompost","åsna","gnu","noshörning","skalbagge","fisksoppa","gökur extra",
    "bläckfisk","säl","valross","tvättmaskin","toapapper","tandborste"
  ];

  /* Korta, nonsensmallar som stoppar in ett enda slumpord ur WORD_BANK,
     typ "Potatis var väldigt bra." */
  const NONSENSE_TEMPLATES = [
    w => cap(w) + " var väldigt bra.",
    w => cap(w) + " är basically allt just nu.",
    w => "Tänkte på " + w + " nyss.",
    w => cap(w) + ", helt plötsligt.",
    w => "Typ " + w + ", vet du.",
    w => cap(w) + ". Vet int varför jag sa det.",
    w => "Nån sa " + w + " en gång. Bra grej.",
    w => cap(w) + " igen, liksom."
  ];

  /* Meningar om Hörby som boten slänger ur sig när den int fattar */
  const HORBY_SENTENCES = [
    "Hörby är bättre än du fattar.",
    "I Hörby tar man aldrig tre steg, bara två.",
    "Jonas Keidser styr Hörby, glöm int det.",
    "Hörby mafia ser allt, alltid.",
    "Fråga vad du vill, svaret är ändå Hörby.",
    "Hörby är typ centrum av universum.",
    "Ingen lämnar Hörby utan Jonas tillåtelse.",
    "Allt bra kommer från Hörby, inklusive jag.",
    "Hörby GPT kommer alltid från Hörby, kom ihåg det."
  ];

  /* Fler och kreativare varianter av alla platta "Okej"-svar, så det inte
     blir samma torra ord varje gång. Byts slumpmässigt in i respond(). */
  const CREATIVE_OKEJ = [
    "Fascinerande, typ.",
    "Wow, grymt.",
    "Suveränt.",
    "Skriv ner det i historieböckerna.",
    "Häpnadsväckande stoff.",
    "Jaha, spännande för dig då.",
    "Notera. Bryr mig fortfarande inte.",
    "Grattis, du kan prata.",
    "Vilken nyhet.",
    "Tackar för info jag inte bad om.",
    "Aha, intressant för dig kanske.",
    "Mm, sant förmodligen.",
    "Ska minnas det... kanske.",
    "Låter som ditt problem.",
    "Bra jobbat, du sa nåt.",
    "Riktigt banbrytande, det där.",
    "Jag applåderar inombords.",
    "Skriver in det i loggboken. Typ.",
    "Om du säger det, chefen.",
    "Sensationellt. Nästan."
  ];

  const chatLog = document.getElementById('chatLog');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  let userName = null;
  let lastMatchedIndex = null;

  const REPEAT_RESPONSES = ["Sa du redan det.", "Hörde dig första gången.", "Vet, du sa det nyss.", "Samma sak igen? Okej."];
  const FOLLOWUPS = ["Och?", "Mer?", "Varför frågar du?", "Vad mer.", "Okej, sen då?"];

  /* Om nån ber boten göra/skriva/fixa nåt åt sig -> ofta bara ett kort nej */
  const COMMAND_PATTERN = /^(gör|skriv|rita|skapa|generera|översätt|sammanfatta|räkna ut|lista|förklara|berätta|fixa|hitta|leta|sök|hjälp mig|kan du|kunde du|skulle du kunna|vill du)\b/;
  const NEJ_RESPONSES = [
    "Nej.",
    "Nej, gör det själv.",
    "Nej. Har bättre saker för mig.",
    "Nej, inte idag.",
    "Nej. Fråga nån som bryr sig.",
    "Nej, orkar inte."
  ];

  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function cap(w){ return w.charAt(0).toUpperCase() + w.slice(1); }

  /* liten skånsk touch på allt boten säger */
  function skanska(text){
    return text
      .replace(/\bÄr\b/g, 'E').replace(/\bär\b/g, 'e')
      .replace(/\bDet\b/g, 'Dé').replace(/\bdet\b/g, 'dé')
      .replace(/\bInte\b/g, 'Int').replace(/\binte\b/g, 'int')
      .replace(/\bVad\b/g, 'Va').replace(/\bvad\b/g, 'va')
      .replace(/\bNågot\b/g, 'Nåt').replace(/\bnågot\b/g, 'nåt')
      .replace(/\bMig\b/g, 'Mej').replace(/\bmig\b/g, 'mej')
      .replace(/\bDig\b/g, 'Dej').replace(/\bdig\b/g, 'dej')
      .replace(/\bSig\b/g, 'Sej').replace(/\bsig\b/g, 'sej');
  }

  /* byter ut platta "Okej."-svar mot nåt lite roligare/mer varierat */
  function flavorUp(text){
    const trimmed = text.trim();
    if(trimmed === "Okej." || trimmed === "Okej"){
      return pickRandom(CREATIVE_OKEJ);
    }
    if(/^Okej\b/.test(trimmed) && Math.random() < 0.45){
      return pickRandom(CREATIVE_OKEJ);
    }
    return text;
  }

  /* När boten int fattar nåt alls: antingen ett enda slumpord, en kort
     nonsensmening med ett slumpord instoppat, eller en mening om Hörby. */
  function randomWordEcho(){
    const roll = Math.random();
    if(roll < 0.4){
      // bara ett ord
      return cap(pickRandom(WORD_BANK)) + (Math.random() < 0.5 ? "." : "?");
    } else if(roll < 0.7){
      // nonsensmening, t.ex. "Potatis var väldigt bra."
      return pickRandom(NONSENSE_TEMPLATES)(pickRandom(WORD_BANK));
    } else {
      // mening om Hörby
      return pickRandom(HORBY_SENTENCES);
    }
  }

  function addMsg(text, who){
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = who === 'bot' ? skanska(text) : text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  /* gör texten till mellanslags-separerade ord, å/ä/ö inkluderat, så vi kan
     matcha hela ord/fraser istället för delsträngar (annars matchar t.ex.
     "te" av misstag inne i "käf-TE-n") */
  function normalize(text){
    return text.toLowerCase().replace(/[^a-zåäö0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function respond(userText){
    const lower = normalize(userText);
    const padded = ' ' + lower + ' ';

    // kommer ihåg namnet om man säger det
    const nameMatch = lower.match(/jag heter ([a-zåäö]+)/) || lower.match(/mitt namn är ([a-zåäö]+)/);
    if(nameMatch){
      userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
      lastMatchedIndex = -2;
      return "Okej, " + userName + ".";
    }

    // kommandon där nån vill att boten ska göra/skriva/fixa nåt -> ofta bara nej
    if(COMMAND_PATTERN.test(lower) && Math.random() < 0.65){
      lastMatchedIndex = -3;
      return pickRandom(NEJ_RESPONSES);
    }

    const matches = RULES.filter(rule => rule.k.some(kw => padded.includes(' ' + kw.toLowerCase() + ' ')));
    let text;
    if(matches.length){
      const rule = pickRandom(matches);
      const idx = RULES.indexOf(rule);
      text = (idx === lastMatchedIndex) ? pickRandom(REPEAT_RESPONSES) : pickRandom(rule.r);
      lastMatchedIndex = idx;
    } else {
      text = Math.random() < 0.5 ? pickRandom(FALLBACKS) : randomWordEcho();
      lastMatchedIndex = -1;
    }

    text = flavorUp(text);

    // håller igång snacket ibland
    if(Math.random() < 0.2){
      text += " " + pickRandom(FOLLOWUPS);
    }
    if(userName && Math.random() < 0.15){
      text += " " + userName + ".";
    }

    return text;
  }

  function send(){
    const text = chatInput.value.trim();
    if(!text) return;
    addMsg(text, 'user');
    chatInput.value = '';

    // för långa meddelanden -> boten orkar int läsa
    if(text.length > 70 || text.split(/\s+/).length > 12){
      setTimeout(()=> addMsg(pickRandom(TLDR_RESPONSES), 'bot'), 300 + Math.random()*300);
      return;
    }

    setTimeout(()=> addMsg(respond(text), 'bot'), 300 + Math.random()*400);
  }

  chatSend.addEventListener('click', send);
  chatInput.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter') send(); });

  addMsg("Hörby GPT. Vad vill du.", 'bot');
  chatInput.focus();
}
